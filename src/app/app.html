<a class="pular" href="#conteudo" (click)="pularParaConteudo($event)">Pular para o conteúdo</a>

<header class="topo">
  <a class="marca" routerLink="/">Sobramar</a>
  @if (usuario()) {
    <nav class="topo__nav" aria-label="Principal">
      <a routerLink="/" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="ativo"
        >Mês atual</a
      >
      <a routerLink="/ano" routerLinkActive="ativo" ariaCurrentWhenActive="page">Ano</a>
    </nav>
    <div class="topo__acoes">
      <button
        type="button"
        class="botao-secundario"
        [attr.aria-pressed]="ocultos()"
        (click)="alternarValores()"
      >
        {{ ocultos() ? 'Mostrar valores' : 'Esconder valores' }}
      </button>
      <button type="button" class="botao-secundario" (click)="sair()">Sair</button>
    </div>
  } @else {
    <nav class="topo__nav" aria-label="Principal"></nav>
  }
</header>

<div class="avisos" role="status" aria-live="polite">
  @if (notificacao(); as aviso) {
    <div class="aviso" [class.aviso--erro]="aviso.tipo === 'erro'">
      <p>{{ aviso.texto }}</p>
      <button type="button" class="botao-secundario" (click)="fecharAviso()">Fechar aviso</button>
    </div>
  }
</div>

<main id="conteudo" #conteudo class="conteudo" tabindex="-1">
  <router-outlet />
</main>

<footer class="rodape">
  <nav aria-label="Informações legais">
    <a routerLink="/privacidade">Política de privacidade</a>
    <a routerLink="/termos">Termos de uso</a>
  </nav>
</footer>
